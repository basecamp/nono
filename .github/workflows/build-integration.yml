# Builds basecamp/nono's `integration` branch (upstream main + our pending
# fixes, see INTEGRATION.md) for the platforms agent-sandbox-nono installs on,
# attests build provenance, and publishes the tarballs as a prerelease tagged
# `integration-<sha12>`.
#
# rebuild-integration.yml starts it on each rebuild; start it by hand with
# `gh workflow run build-integration.yml --ref integration`. A push does not
# start it: a commit merged into integration is replaced by the next rebuild.
# A failed build keeps one issue labelled integration-build open until a build
# succeeds.
#
# The fork's own workflows are the only ones on integration: the rebuild
# removes upstream's (.github/integration/rebuild).
#
# Verify a download with:
#   gh attestation verify nono-integration-<sha12>-<target>.tar.gz \
#     --repo basecamp/nono \
#     --signer-workflow basecamp/nono/.github/workflows/build-integration.yml \
#     --source-ref refs/heads/integration --source-digest <full sha> \
#     --deny-self-hosted-runners
name: Build integration

on:
  workflow_dispatch:

permissions: {}

# One build at a time: builds report to one shared issue, so an older build finishing after a
# newer one must not close the issue the newer one opened. A build queued behind another replaces
# any older one still waiting (the newer integration supersedes it).
concurrency:
  group: build-integration
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.repository == 'basecamp/nono' && github.ref == 'refs/heads/integration'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Same runners and targets as upstream's release.yml.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
          - target: aarch64-apple-darwin
            os: macos-14
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
    env:
      TARGET: ${{ matrix.target }}
      NATIVE: ${{ matrix.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      # rustup ships on the hosted runners. Upstream uses dtolnay/rust-toolchain,
      # which has no immutable tags: its branches are regenerated, so a pinned
      # SHA ends up orphaned (upstream's pin already is).
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
          rustc --version

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p nono-cli

      - name: Verify binary does not link libdbus (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          needed="$(objdump -p "target/$TARGET/release/nono" | awk '/NEEDED/ {print $2}')"
          echo "$needed"
          if grep -qi '^libdbus' <<<"$needed"; then
            echo "::error::nono links libdbus; the binary is not portable"
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/nono"
          file "$bin"
          if [ "$NATIVE" = "true" ]; then
            "$bin" --version
          fi

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          name="nono-integration-${GITHUB_SHA::12}-$TARGET.tar.gz"
          tar -czf "dist/$name" -C "target/$TARGET/release" nono
          ( cd dist && shasum -a 256 -- "$name" )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nono-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # store the provenance attestation on the repo
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: nono-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish prerelease
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the integration-<sha12> tag and prerelease
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create release integration-<sha12>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="integration-${GITHUB_SHA::12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag already exists; integration releases are immutable"
            exit 1
          fi
          cat > notes.md <<EOF
          Unofficial build of basecamp/nono \`integration\` at ${GITHUB_SHA}: upstream nolabs-ai/nono main plus the pending fixes listed in [INTEGRATION.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/INTEGRATION.md).

          Not signed or notarized for macOS. Verify before use:

              gh attestation verify <tarball> --repo ${GITHUB_REPOSITORY} \\
                --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/build-integration.yml \\
                --source-ref refs/heads/integration --source-digest ${GITHUB_SHA} \\
                --deny-self-hosted-runners
          EOF
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            --prerelease \
            --latest=false

  report:
    needs: [build, attest, release]
    if: always() && github.repository == 'basecamp/nono' && github.ref == 'refs/heads/integration' && !cancelled()
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out .github/integration/issue
      issues: write # open, comment on and close the integration-build issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/integration

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="integration-${GITHUB_SHA::12}"
          if [ "$RESULT" = success ]; then
            .github/integration/issue integration-build success "$tag is built, attested and published ([run]($RUN_URL))."
          else
            .github/integration/issue integration-build failure "Building integration failed" \
              "$(date -u +%F): building, attesting or publishing $tag (integration at ${GITHUB_SHA:0:12}) failed ([run]($RUN_URL)). No release was published; the latest integration-* release is still the newest build."
          fi
